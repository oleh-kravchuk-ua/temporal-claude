# Local stack: a single Temporal dev-server container (server + Web UI) plus our worker and
# HTTP API, and a one-shot client (profile `tools`). worker/api/client are the same image
# with different commands.
#
#   docker compose up                 # temporal + worker + api
#   docker compose run --rm client    # start one workflow, print its id, exit
#   Web UI: http://localhost:8233   ·   REST API: http://localhost:3000

services:
  temporal:
    image: temporalio/temporal:latest
    command: ['server', 'start-dev', '--ip', '0.0.0.0']
    ports:
      - '7233:7233' # gRPC
      - '8233:8233' # Web UI
    healthcheck:
      test: ['CMD', 'temporal', 'operator', 'cluster', 'health', '--address', '127.0.0.1:7233']
      interval: 5s
      timeout: 5s
      retries: 30

  worker:
    build: .
    command: ['npm', 'run', 'worker']
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      NODE_ENV: production
    depends_on:
      temporal:
        condition: service_healthy

  api:
    build: .
    command: ['npm', 'run', 'api']
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      HTTP_HOST: 0.0.0.0
      NODE_ENV: production
    ports:
      - '3000:3000'
    depends_on:
      temporal:
        condition: service_healthy

  client:
    build: .
    command: ['npm', 'run', 'start']
    profiles: ['tools']
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      temporal:
        condition: service_healthy
