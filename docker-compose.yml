# Local stack: a single Temporal dev-server container (server + Web UI) plus our worker and
# HTTP API, and a one-shot client (profile `tools`). worker/api/client are the same image
# with different commands.
#
#   docker compose up --build         # temporal + worker + api (--build: never run a stale image)
#   docker compose run --rm --build client   # start one workflow, print its id, exit
#   Web UI: http://localhost:8233   ·   REST API: http://localhost:3000
#
# App config: each service loads `.env` then `.env.local` (optional — absent in CI/fresh
# clones) via `env_file`, so LOG_LEVEL / CORS_ORIGIN / TEMPORAL_API_KEY etc. come from there.
# The `environment:` block then OVERRIDES the values that must differ inside the compose
# network (TEMPORAL_ADDRESS uses the `temporal` service DNS, not localhost).

x-app-env: &app-env
  env_file:
    - path: .env
      required: false
    - path: .env.local
      required: false

services:
  temporal:
    image: temporalio/temporal:latest
    command: ['server', 'start-dev', '--ip', '0.0.0.0']
    ports:
      - '7233:7233' # gRPC
      - '8233:8233' # Web UI
    healthcheck:
      test: ['CMD', 'temporal', 'operator', 'cluster', 'health', '--address', '127.0.0.1:7233']
      interval: 5s
      timeout: 5s
      retries: 30

  worker:
    build: .
    command: ['npm', 'run', 'worker']
    <<: *app-env
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      NODE_ENV: production
    depends_on:
      temporal:
        condition: service_healthy

  api:
    build: .
    command: ['npm', 'run', 'api']
    <<: *app-env
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      HTTP_HOST: 0.0.0.0
      NODE_ENV: production
    ports:
      - '3000:3000'
    depends_on:
      temporal:
        condition: service_healthy

  client:
    build: .
    command: ['npm', 'run', 'start']
    profiles: ['tools']
    <<: *app-env
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      temporal:
        condition: service_healthy
